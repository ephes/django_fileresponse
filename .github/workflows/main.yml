name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: settings.ini
      - name: Install supported development toolchain
        run: python -m pip install -e '.[dev]'
      - name: Lint and typecheck
        run: |
          ruff check fileresponse tests scripts
          mypy fileresponse scripts
      - name: Check notebook exports and README
        run: python scripts/generate.py --check
      - name: Synthetic streaming and adapter tests
        run: python -m unittest discover -s tests -v
      - name: Build and test installed wheel and sdist
        run: |
          python -m build
          python scripts/package_smoke.py
